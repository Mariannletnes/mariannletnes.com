<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Øvelse: hobby og engasjement — Mari-Ann Letnes</title>
<meta name="description" content="Interaktiv parøvelse om engasjement, til foredraget Engasjerende læring.">
<meta property="og:title" content="Øvelse: hobby og engasjement">
<meta property="og:image" content="https://mariannletnes.com/portrett-mork.jpg">
<meta property="og:type" content="article">
<meta property="og:url" content="https://mariannletnes.com/ovelse-engasjerende-laering-udi.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23332830'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23F8F4F1' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F4F1; --stone:#EDE7E2; --dark:#332830;
    --plum:#6E4B57; --plum-soft:#B79BA4;
    --ink:#4A3C43; --body:#5E4F55; --quiet:#7E6F74;
    --hair:#E1D8D1; --hair-stone:#DBD1C9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--stone);color:var(--body);
    font-family:'Jost',system-ui,sans-serif;
    font-size:1.08rem;font-weight:400;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  a{color:inherit}
  :focus-visible{outline:2px solid var(--plum);outline-offset:3px}
  button{font-family:inherit;cursor:pointer}

  .top{padding:22px 24px}
  .signature{
    font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;font-weight:400;
    color:var(--ink);text-decoration:none;
  }

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px 40px}

  .card{
    background:var(--paper);border:1px solid var(--hair-stone);
    width:100%;max-width:480px;padding:36px 30px 30px;
  }

  .progress{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
  .pill{
    width:40px;height:40px;border:1px solid var(--hair-stone);background:transparent;
    color:var(--quiet);font-size:1.02rem;display:flex;align-items:center;justify-content:center;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .pill.active{background:var(--plum);border-color:var(--plum);color:#F7F1F2}
  .pill.done{border-color:var(--plum-soft);color:var(--plum)}

  .step-time{font-size:.98rem;color:var(--plum);margin-bottom:10px}
  .step-title{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
    font-size:1.9rem;line-height:1.18;color:var(--ink);margin-bottom:16px;
  }
  .step-desc{font-size:1.1rem;line-height:1.66;color:var(--body)}

  .nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:34px;gap:16px}
  .btn-next{
    background:var(--dark);color:#F7F1F2;border:none;text-decoration:none;
    font-size:1.04rem;padding:15px 30px;transition:background .2s;flex:1;text-align:center;
  }
  .btn-next:hover{background:var(--ink)}
  .btn-next:disabled{opacity:.35;cursor:default}
  .btn-prev{
    background:transparent;border:none;color:var(--quiet);font-size:1.02rem;
    padding:15px 6px;box-shadow:inset 0 -1px 0 transparent;
  }
  .btn-prev:disabled{opacity:0;pointer-events:none}
  .btn-prev:not(:disabled):hover{color:var(--plum)}

  .end-note{font-size:1.02rem;color:var(--quiet);margin-top:34px;line-height:1.6}

  .restart-row{text-align:center;margin-top:26px}
  .restart{
    background:none;border:none;color:var(--quiet);font-size:.96rem;
    box-shadow:inset 0 -1px 0 var(--hair-stone);padding-bottom:2px;
  }
  .restart:hover{color:var(--plum);box-shadow:inset 0 -1px 0 var(--plum)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <a href="index.html" class="signature">Mari-Ann Letnes</a>
</div>

<main>
  <div class="card">
    <div class="progress" id="progress"></div>
    <p class="step-time" id="stepTime"></p>
    <h1 class="step-title" id="stepTitle"></h1>
    <p class="step-desc" id="stepDesc"></p>
    <p class="end-note" id="endNote" style="display:none">Det var siste punkt. Vent til dere blir bedt om å dele i plenum.</p>

    <div class="nav-row">
      <button class="btn-prev" id="prevBtn">Forrige</button>
      <button class="btn-next" id="nextBtn">Neste</button>
    </div>
  </div>
</main>

<div class="restart-row">
  <button class="restart" id="restartBtn">Start på nytt</button>
</div>

<script>
  var steps = [
    { time: "", title: "Bli i paret ditt", desc: "Dere er allerede i par fra Snakk og bytt-kortene. Forskningen viser at engasjement ikke er en fast egenskap — det formes av situasjonen. Det betyr at engasjement kan skapes. Det skal dere prøve nå, helt konkret." },
    { time: "Ca. 1 minutt", title: "Tenk på en hobby", desc: "Tenk stille på en hobby eller interesse du selv er ekte engasjert i — ikke noe som høres bra ut, men noe du faktisk brenner for." },
    { time: "Ca. 3 minutter", title: "Runde 1 — du forteller", desc: "Bestem hvem som starter (A). A: du har tre minutter på å få den andre minst like engasjert i hobbyen din som du selv er. B: ikke lat som noe — bare merk ærlig hva som skjer i deg." },
    { time: "Ca. 3 minutter", title: "Bytt roller", desc: "Nå er det B sin tur til å dele sin hobby, mens A lytter og legger merke til hva som skjer i seg selv." },
    { time: "Ca. 1 minutt, hver for deg", title: "Tenk gjennom", desc: "Ble jeg mer engasjert? Hva gjorde partneren min, helt konkret, som virket — eller ikke virket?" },
    { time: "Ca. 2 minutter", title: "Del med hverandre", desc: "Fortell hverandre hva dere la merke til." },
    { time: "", title: "Del i plenum", desc: "Fortell om et øyeblikk der du merket at du ble mer nysgjerrig, ivrig eller ville prøve selv. Hva var det partneren din gjorde da?" }
  ];

  var current = 0;

  var progressEl = document.getElementById('progress');
  var timeEl = document.getElementById('stepTime');
  var titleEl = document.getElementById('stepTitle');
  var descEl = document.getElementById('stepDesc');
  var endNoteEl = document.getElementById('endNote');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var restartBtn = document.getElementById('restartBtn');

  function goTo(i){ current = i; render(); }

  function renderProgress(){
    progressEl.innerHTML = '';
    for (var i = 0; i < steps.length; i++){
      (function(i){
        var b = document.createElement('button');
        b.className = 'pill' + (i === current ? ' active' : (i < current ? ' done' : ''));
        b.textContent = i + 1;
        b.setAttribute('aria-label', 'Gå til punkt ' + (i + 1));
        b.addEventListener('click', function(){ goTo(i); });
        progressEl.appendChild(b);
      })(i);
    }
  }

  function render(){
    renderProgress();
    var s = steps[current];
    timeEl.textContent = s.time;
    timeEl.style.display = s.time ? 'block' : 'none';
    titleEl.textContent = s.title;
    descEl.textContent = s.desc;
    prevBtn.disabled = (current === 0);
    var last = (current === steps.length - 1);
    nextBtn.style.display = last ? 'none' : 'block';
    endNoteEl.style.display = last ? 'block' : 'none';
  }

  prevBtn.addEventListener('click', function(){ if (current > 0){ current--; render(); } });
  nextBtn.addEventListener('click', function(){ if (current < steps.length - 1){ current++; render(); } });
  restartBtn.addEventListener('click', function(){ current = 0; render(); });

  render();
</script>

</body>
</html>
