<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Planlegging: design for læring — Mari-Ann Letnes</title>
<meta name="description" content="Interaktivt planleggingsverktøy basert på Selander & Kress' modell for design av en formell lærsekvens.">
<meta property="og:title" content="Planlegging: design for læring">
<meta property="og:image" content="https://mariannletnes.com/portrett-mork.jpg">
<meta property="og:type" content="article">
<meta property="og:url" content="https://mariannletnes.com/planlegging-design-for-laering.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23332830'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23F8F4F1' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F8F4F1; --stone:#EDE7E2; --dark:#332830;
    --plum:#6E4B57; --plum-soft:#B79BA4;
    --ink:#4A3C43; --body:#5E4F55; --quiet:#7E6F74;
    --hair:#E1D8D1; --hair-stone:#DBD1C9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--stone);color:var(--body);
    font-family:'Jost',system-ui,sans-serif;
    font-size:1.08rem;font-weight:400;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  a{color:inherit}
  :focus-visible{outline:2px solid var(--plum);outline-offset:3px}
  button{font-family:inherit;cursor:pointer}

  .top{padding:22px 24px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .signature{
    font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;font-weight:400;
    color:var(--ink);text-decoration:none;
  }
  .source{font-size:.92rem;color:var(--quiet)}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px 40px}

  .card{
    background:var(--paper);border:1px solid var(--hair-stone);
    width:100%;max-width:560px;padding:36px 30px 30px;
  }

  .progress{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .pill{
    width:34px;height:34px;border:1px solid var(--hair-stone);background:transparent;
    color:var(--quiet);font-size:.94rem;display:flex;align-items:center;justify-content:center;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .pill.active{background:var(--plum);border-color:var(--plum);color:#F7F1F2}
  .pill.done{border-color:var(--plum-soft);color:var(--plum)}

  .kicker{font-size:.98rem;color:var(--plum);margin-bottom:10px}
  .step-title{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
    font-size:1.85rem;line-height:1.18;color:var(--ink);margin-bottom:14px;
  }
  .step-desc{font-size:1.06rem;line-height:1.62;color:var(--body);margin-bottom:20px}
  .prompt{font-size:1.02rem;color:var(--ink);margin-bottom:10px;font-weight:500}
  textarea{
    width:100%;min-height:110px;background:var(--paper);color:var(--ink);
    border:1px solid var(--hair-stone);padding:12px 14px;font-family:inherit;
    font-size:1.02rem;line-height:1.5;resize:vertical;
  }
  textarea::placeholder{color:var(--quiet)}

  .summary-item{border-top:1px solid var(--hair);padding:16px 0}
  .summary-item:first-child{border-top:none;padding-top:0}
  .summary-kicker{font-size:.9rem;color:var(--plum);margin-bottom:4px}
  .summary-title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:1.25rem;color:var(--ink);margin-bottom:6px}
  .summary-answer{font-size:1rem;color:var(--body);white-space:pre-wrap}
  .summary-empty{font-size:1rem;color:var(--quiet);font-style:italic}
  .summary-note{font-size:.94rem;color:var(--quiet);margin-top:20px;line-height:1.6}
  .download-btn{
    display:inline-block;margin-top:18px;background:var(--dark);color:#F7F1F2;
    border:none;text-decoration:none;font-size:1.02rem;padding:14px 26px;
    transition:background .2s;
  }
  .download-btn:hover{background:var(--ink)}

  .nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:26px;gap:16px}
  .btn-next{
    background:var(--dark);color:#F7F1F2;border:none;text-decoration:none;
    font-size:1.04rem;padding:15px 30px;transition:background .2s;flex:1;text-align:center;
  }
  .btn-next:hover{background:var(--ink)}
  .btn-prev{
    background:transparent;border:none;color:var(--quiet);font-size:1.02rem;
    padding:15px 6px;
  }
  .btn-prev:disabled{opacity:0;pointer-events:none}
  .btn-prev:not(:disabled):hover{color:var(--plum)}

  .restart-row{text-align:center;margin-top:26px}
  .restart{
    background:none;border:none;color:var(--quiet);font-size:.96rem;
    box-shadow:inset 0 -1px 0 var(--hair-stone);padding-bottom:2px;
  }
  .restart:hover{color:var(--plum);box-shadow:inset 0 -1px 0 var(--plum)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <a href="index.html" class="signature">Mari-Ann Letnes</a>
  <span class="source">Selander &amp; Kress (2010) — design for læring</span>
</div>

<div class="top" style="padding-top:0">
  <p style="font-size:.98rem;color:var(--body);max-width:520px">Snakk sammen i modulgruppa om hvert punkt før dere skriver — det er det dere blir enige om som skal stå her.</p>
</div>

<main>
  <div class="card">
    <div class="progress" id="progress"></div>
    <p class="kicker" id="stepKicker"></p>
    <h1 class="step-title" id="stepTitle"></h1>
    <p class="step-desc" id="stepDesc"></p>
    <div id="inputArea"></div>
    <div id="summaryArea"></div>

    <div class="nav-row">
      <button class="btn-prev" id="prevBtn">Forrige</button>
      <button class="btn-next" id="nextBtn">Neste</button>
    </div>
  </div>
</main>

<div class="restart-row">
  <button class="restart" id="restartBtn">Start på nytt</button>
</div>

<script>
  var steps = [
    {
      kicker: "Utgangspunktet",
      title: "Ressurser, mål og rammer",
      desc: "Modellen starter med det som er gitt før økta i det hele tatt begynner: hvilke ressurser finnes, hva er målet, og hvilke institusjonelle føringer — normer, rutiner, regler — styrer rommet dere jobber i?",
      prompt: "Hva er de viktigste ressursene, målene og føringene for modulen deres?",
      placeholder: "Skriv det dere blir enige om …"
    },
    {
      kicker: "Første transformasjonssyklus",
      title: "Iscenesetting",
      desc: "Hvordan setter du scenen? Dette er det første møtet med innholdet — rammen som gjør at beboerne vet hva som skal skje og hvorfor.",
      prompt: "Hvordan vil dere iscenesette akkurat denne økta?",
      placeholder: "Skriv det dere blir enige om …"
    },
    {
      kicker: "Første transformasjonssyklus",
      title: "Transformering",
      desc: "Her arbeider deltakerne aktivt med stoffet og de tilgjengelige ressursene — de gjør informasjonen til sin egen. Dette er kjernen i «design i læring»: at beboerne selv får omforme, ikke bare motta.",
      prompt: "Hvilke ressurser skal beboerne bruke aktivt, og hvordan?",
      placeholder: "Skriv det dere blir enige om …"
    },
    {
      kicker: "Første transformasjonssyklus",
      title: "Behandling",
      desc: "Etter at deltakerne har jobbet med stoffet, bearbeides det videre — det som var løst og utforskende, begynner å ta form.",
      prompt: "Hvordan skal denne bearbeidingen skje hos dere?",
      placeholder: "Skriv det dere blir enige om …"
    },
    {
      kicker: "Andre transformasjonssyklus",
      title: "Representasjon",
      desc: "Nå skal det som er bearbeidet komme til uttrykk — beboerne viser fram det de har forstått, i en form andre kan se eller høre.",
      prompt: "Hvordan kan beboerne vise fram det de har forstått?",
      placeholder: "Skriv det dere blir enige om …"
    },
    {
      kicker: "Andre transformasjonssyklus",
      title: "Diskusjon og metarefleksjon",
      desc: "Uttrykket blir gjenstand for felles refleksjon — dere snakker sammen om hva det viser, og hva det betyr.",
      prompt: "Hvordan skaper dere rom for denne samtalen?",
      placeholder: "Skriv det dere blir enige om …"
    },
    {
      kicker: "Andre transformasjonssyklus",
      title: "Karakter",
      desc: "Til slutt får det hele en «karakter» — en form det har landet på denne gangen. Ikke nødvendigvis ferdig, men et stoppested.",
      prompt: "Hva sitter beboerne igjen med etter denne økta?",
      placeholder: "Skriv det dere blir enige om …"
    },
    {
      kicker: "Gjennomgående",
      title: "Tegn på læring",
      desc: "Gjennom hele forløpet spør vi: hva erkjenner vi som tegn på læring? Noe brukes underveis (formativt), noe oppsummeres til slutt (summativt).",
      prompt: "Hva vil dere se etter som tegn på at det virket?",
      placeholder: "Skriv det dere blir enige om …"
    }
  ];

  var answers = {};
  var current = 0;
  var totalSteps = steps.length + 1; // +1 for oppsummeringen

  var progressEl = document.getElementById('progress');
  var kickerEl = document.getElementById('stepKicker');
  var titleEl = document.getElementById('stepTitle');
  var descEl = document.getElementById('stepDesc');
  var inputArea = document.getElementById('inputArea');
  var summaryArea = document.getElementById('summaryArea');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var restartBtn = document.getElementById('restartBtn');

  function goTo(i){ current = i; render(); }

  function renderProgress(){
    progressEl.innerHTML = '';
    for (var i = 0; i < totalSteps; i++){
      (function(i){
        var b = document.createElement('button');
        b.className = 'pill' + (i === current ? ' active' : (i < current ? ' done' : ''));
        b.textContent = i + 1;
        b.setAttribute('aria-label', 'Gå til punkt ' + (i + 1));
        b.addEventListener('click', function(){ goTo(i); });
        progressEl.appendChild(b);
      })(i);
    }
  }

  function renderSummary(){
    summaryArea.innerHTML = '';
    for (var i = 0; i < steps.length; i++){
      var s = steps[i];
      var item = document.createElement('div');
      item.className = 'summary-item';
      var k = document.createElement('p');
      k.className = 'summary-kicker';
      k.textContent = s.kicker;
      var t = document.createElement('p');
      t.className = 'summary-title';
      t.textContent = s.title;
      var a = document.createElement('p');
      var txt = answers[i] ? answers[i] : '';
      a.className = txt ? 'summary-answer' : 'summary-empty';
      a.textContent = txt ? txt : 'Ikke fylt ut.';
      item.appendChild(k); item.appendChild(t); item.appendChild(a);
      summaryArea.appendChild(item);
    }
    var note = document.createElement('p');
    note.className = 'summary-note';
    note.textContent = 'Last ned svarene dine før du lukker siden — de lagres ikke automatisk noe annet sted.';
    summaryArea.appendChild(note);

    var dlBtn = document.createElement('button');
    dlBtn.className = 'download-btn';
    dlBtn.textContent = 'Last ned svarene dine (.pdf)';
    dlBtn.addEventListener('click', downloadAnswers);
    summaryArea.appendChild(dlBtn);
  }

  function downloadAnswers(){
    if (window.jspdf && window.jspdf.jsPDF){
      downloadAsPDF();
    } else {
      downloadAsTxt();
    }
  }

  function downloadAsPDF(){
    var doc = new window.jspdf.jsPDF();
    var margin = 20;
    var maxWidth = 170;
    var pageBottom = 280;
    var y = 24;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(17);
    doc.text('Design for læring — min plan', margin, y);
    y += 8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(120, 120, 120);
    doc.text('Basert på Selander & Kress (2010), Design för lärande', margin, y);
    doc.setTextColor(20, 20, 20);
    y += 14;

    for (var i = 0; i < steps.length; i++){
      var s = steps[i];
      if (y > pageBottom - 20){ doc.addPage(); y = 24; }

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(130, 90, 100);
      doc.text(s.kicker, margin, y);
      y += 6;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(20, 20, 20);
      doc.text(s.title, margin, y);
      y += 8;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(11);
      doc.setTextColor(60, 60, 60);
      var text = answers[i] ? answers[i] : '(ikke fylt ut)';
      var lines = doc.splitTextToSize(text, maxWidth);
      for (var j = 0; j < lines.length; j++){
        if (y > pageBottom){ doc.addPage(); y = 24; }
        doc.text(lines[j], margin, y);
        y += 6;
      }
      y += 8;
    }

    doc.save('design-for-laering-plan.pdf');
  }

  function downloadAsTxt(){
    var lines = ['Design for læring — min plan', 'Basert på Selander & Kress (2010)', ''];
    for (var i = 0; i < steps.length; i++){
      var s = steps[i];
      lines.push(s.kicker + ' — ' + s.title);
      lines.push(answers[i] ? answers[i] : '(ikke fylt ut)');
      lines.push('');
    }
    var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'design-for-laering-plan.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function render(){
    renderProgress();
    var isSummary = (current === steps.length);

    if (isSummary){
      kickerEl.textContent = '';
      kickerEl.style.display = 'none';
      titleEl.textContent = 'Din plan, samlet';
      descEl.textContent = 'Slik ser hele forløpet ut, fra ramme til tegn på læring.';
      inputArea.innerHTML = '';
      renderSummary();
      summaryArea.style.display = 'block';
      prevBtn.disabled = false;
      nextBtn.style.display = 'none';
    } else {
      var s = steps[current];
      kickerEl.style.display = 'block';
      kickerEl.textContent = s.kicker;
      titleEl.textContent = s.title;
      descEl.textContent = s.desc;
      summaryArea.style.display = 'none';
      summaryArea.innerHTML = '';

      inputArea.innerHTML = '';
      var label = document.createElement('p');
      label.className = 'prompt';
      label.textContent = s.prompt;
      var ta = document.createElement('textarea');
      ta.placeholder = s.placeholder;
      ta.value = answers[current] ? answers[current] : '';
      ta.addEventListener('input', function(){ answers[current] = ta.value; });
      inputArea.appendChild(label);
      inputArea.appendChild(ta);

      prevBtn.disabled = (current === 0);
      nextBtn.style.display = 'block';
      nextBtn.textContent = (current === steps.length - 1) ? 'Se oppsummering' : 'Neste';
    }
  }

  prevBtn.addEventListener('click', function(){ if (current > 0){ current--; render(); } });
  nextBtn.addEventListener('click', function(){ if (current < totalSteps - 1){ current++; render(); } });
  restartBtn.addEventListener('click', function(){ current = 0; answers = {}; render(); });

  render();
</script>

</body>
</html>
